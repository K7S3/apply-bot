# CI for the candid Docker one-command run (batch 100).
#
# Triggers only when Docker-related files change. Builds the image, runs
# `python -m candid --version` inside the container, then starts the
# dashboard with --host 0.0.0.0, waits for HTTP 200 on localhost:8765,
# and stops the container.

name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - docker-compose.dev.yml
      - candid/**
      - requirements.txt
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose.yml
      - docker-compose.dev.yml
      - candid/**
      - requirements.txt

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t candid:ci .

      - name: Run --version in container
        run: |
          docker run --rm \
            -e CANDID_SKIP_WIZARD=1 \
            candid:ci --version

      - name: Start dashboard and curl it
        run: |
          docker run -d --name candid-dash \
            -e CANDID_SKIP_WIZARD=1 \
            -p 8765:8765 \
            candid:ci dashboard --host 0.0.0.0 --no-browser
          # Wait up to ~30s for the dashboard to answer HTTP 200.
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null -w "%{http_code}" http://localhost:8765 | grep -q 200; then
              echo "dashboard answered HTTP 200 after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              echo "dashboard never answered HTTP 200"
              docker logs candid-dash || true
              exit 1
            fi
          done

      - name: Stop dashboard container
        if: always()
        run: docker rm -f candid-dash || true
