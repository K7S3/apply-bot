# candid — local-first job-search copilot
# Build:  python -m build
# Install: pip install dist/candid-*.whl   (or: pip install candid once published)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "candid"
description = "Local-first job-search copilot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]
authors = [
    { name = "Keshavan Seshadri", email = "keshavanseshadri@gmail.com" },
]
keywords = ["jobs", "career", "job-search", "interview-prep", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = []  # candid is stdlib-only by design

[project.optional-dependencies]
pdf = ["pypdf>=3.0.0"]  # optional: PDF resume parsing for `onboard --resume file.pdf`

[project.urls]
Homepage = "https://github.com/K7S3/candid"

[project.scripts]
candid = "candid.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "candid.__version__" }

[tool.setuptools.packages.find]
include = ["candid*"]

# Data files the CLI reads at runtime (dashboard UI, mock problems,
# interviewer personas, behavioral rubric, system-design question bank):
# dashboard.py reads  data/dashboard.html; mock.py reads
# data/problems/*.json, data/personas.json, data/behavioral.json,
# data/system_design.json — all relative to the installed package dir.
[tool.setuptools.package-data]
candid = ["data/*.html", "data/*.json", "data/problems/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
